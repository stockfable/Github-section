                        name: p.name,
                        price: p.price,
                        oldPrice: p.oldPrice,
                        imageUrl: p.imageUrl,
                        link: p.link,
                        description: p.description,
                        createdAt: new Date()
                    });
                    success++;
                    logEl.innerHTML += `<span class="success">✅ ${i + 1}. ${p.name.substring(0, 50)}...</span>\n`;

                    failed++;
                    logEl.innerHTML += `<span class="error">❌ ${i + 1}. Failed: ${err.message}</span>\n`;
